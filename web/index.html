<!doctype html>
<html lang="en" class="dark">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <meta name="description" content="InstaEdit — Modifica thumbnail YouTube con un click." />
  <meta name="author" content="InstaEdit" />
  <meta name="robots" content="index, follow" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>InstaEdit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL@20..48,100..700,0..1&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            accent: { DEFAULT: "#D83B01", hover: "#BF3401", muted: "rgba(216,59,1,0.15)" },
            surface: { DEFAULT: "#1B1B1E", hover: "#242428", muted: "#161618" },
            border: "rgba(255,255,255,0.08)",
          },
          fontFamily: { sans: ["Inter", "sans-serif"] },
          borderRadius: { DEFAULT: "0.625rem", "2xl": "0.875rem", "3xl": "1.125rem" },
        },
      },
    };
  </script>
  <style>
    :root {
      --bg-primary: #121212;
      --bg-surface: #1B1B1E;
      --bg-surface-hover: #242428;
      --bg-muted: #161618;
      --accent: #D83B01;
      --accent-hover: #BF3401;
      --border-subtle: rgba(255,255,255,0.08);
      --border-dashed: rgba(255,255,255,0.12);
      --text-primary: #f1f5f9;
      --text-secondary: rgba(255,255,255,0.55);
      --text-muted: rgba(255,255,255,0.35);
    }
    html, body { height: 100%; background: var(--bg-primary); color: var(--text-primary); }
    body { font-family: "Inter", sans-serif; }
    .material-symbols-rounded {
      font-variation-settings: "FILL" 1, "wght" 400, "GRAD" 0, "opsz" 24;
    }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
  </style>
</head>

<body class="flex h-screen overflow-hidden bg-[#121212]">
  <div id="react-script-tab-root" class="flex h-screen w-full overflow-hidden"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
